name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod   # reads version directly from go.mod — stays in sync automatically
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" ./...

      - name: Test
        run: go test ./... -race -count=1 -timeout=120s

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify lockfile in sync
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json || {
            echo ""
            echo "::error::package-lock.json is out of sync with package.json."
            echo "::error::Run 'cd frontend && npm install' locally and commit the updated lockfile."
            exit 1
          }

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint || true   # non-fatal until rules stabilise

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # No condition — runs on every push and every PR so Dockerfile regressions
    # are caught immediately, not just when landing on main.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: natsui-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: natsui-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
