# nats-edge — a single-node "edge" cluster that federates with the main
# "natsui" cluster over a gateway connection (NATS supercluster). Brought up
# only via the "federation" compose profile to demonstrate gateway topology.
server_name: nats-edge
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

cluster {
  name: edge
  listen: 0.0.0.0:6222
}

# Dial the main cluster's gateway listener. The gateway name must equal this
# server's cluster name ("edge"); the remote points at nats1's gateway port.
gateway {
  name: edge
  listen: 0.0.0.0:7222
  gateways: [
    { name: natsui, url: "nats://nats1:7222" }
  ]
}
