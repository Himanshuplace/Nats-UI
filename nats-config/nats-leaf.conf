# nats-leaf — an edge/spoke NATS server that attaches to the main cluster as a
# leaf node (via nats1's leafnode listener on :7422). Brought up only via the
# "federation" compose profile to demonstrate leaf-node topology.
server_name: nats-leaf
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

leafnodes {
  remotes: [
    { url: "nats://nats1:7422" }
  ]
}
