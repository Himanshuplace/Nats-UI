server_name: nats1
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Token auth — all clients must present this token to connect.
# Change via NATS_AUTH_TOKEN in docker-compose or override here.
authorization {
  token: $NATS_AUTH_TOKEN
}

jetstream {
  store_dir: /data
}

cluster {
  name: natsui
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats2:6222
    nats-route://nats3:6222
  ]
}

# Leaf-node entry point. Inert listener — quiet until a leaf dials in
# (see nats-leaf.conf, behind the "federation" compose profile).
leafnodes {
  listen: 0.0.0.0:7422
}

# Gateway entry point for supercluster federation. Listener only (no remotes),
# so this stays quiet on the default stack; when the "edge" cluster dials in
# (nats-edge.conf, "federation" profile) it appears as an inbound gateway and
# NATS auto-creates the reverse link. Gateway name must equal the cluster name.
gateway {
  name: natsui
  listen: 0.0.0.0:7222
}
