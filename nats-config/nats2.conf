server_name: nats2
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

authorization {
  token: $NATS_AUTH_TOKEN
}

jetstream {
  store_dir: /data
}

cluster {
  name: natsui
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats1:6222
    nats-route://nats3:6222
  ]
}

# Leaf-node entry point for the cluster. Inert listener — quiet until a leaf
# dials in (see nats-leaf.conf, behind the "federation" compose profile). Lives
# here rather than on nats1 because nats1 already hosts the gateway listener,
# and one server can't define both without a configured system account.
leafnodes {
  listen: 0.0.0.0:7422
}
